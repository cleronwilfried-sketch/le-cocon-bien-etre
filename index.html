const LEGAL_CONTACT_EMAIL="<a href='mailto:salon@lecocon14.com'>salon@lecocon14.com</a>";
function localizedLegal(which){
 const t=LEGAL_TRANSLATIONS[lang];if(!t)return LEGAL_PAGES[which]||LEGAL_PAGES['mentions-legales'];
 const label=(a,b)=>'<p><strong>'+a+':</strong> '+b+'</p>';
 const contact=t.questions+' '+LEGAL_CONTACT_EMAIL;
 const titles=which==='mentions-legales'?t.legalSections:which==='politique-confidentialite'?t.privacySections:t.cookieSections;
 let sections;
 if(which==='mentions-legales'){
  sections=[
   label(t.owner[0],'Le Cocon Bien-Être')+label(t.owner[1],'Pearl Bartert')+label(t.owner[2],t.self)+label('SIRET','941 889 388 00018')+label(t.owner[3],'12 rue Ménars, 14130 Pont-l’Évêque')+label(t.owner[4],"<a href='tel:+33259163936'>02 59 16 39 36</a>")+label(t.owner[5],LEGAL_CONTACT_EMAIL),
   '<p>Pearl Bartert.</p>','<p>'+t.host+'</p>','<p>'+t.ip+'</p>','<p>'+t.ask+' '+LEGAL_CONTACT_EMAIL+'</p>'
  ];
 }else if(which==='politique-confidentialite'){
  sections=['<p>'+t.controller+'</p><p>'+contact+'</p>','<p>'+t.data+'</p>','<p>'+t.retention+'</p>','<p>'+t.rights+'</p><p>'+t.exercise+' '+LEGAL_CONTACT_EMAIL+'. '+t.authority+'</p>','<p>'+t.storage+'</p>'];
 }else{
  sections=['<p>'+t.what+'</p>','<p>'+t.preference+'</p>','<p>'+t.external+'</p>','<p>'+t.choices+'</p>','<p>'+contact+'</p>'];
 }
 return {title:which==='mentions-legales'?t.legal:which==='politique-confidentialite'?t.privacy:t.cookies,intro:which==='mentions-legales'?t.legalIntro:which==='politique-confidentialite'?t.privacyIntro:t.cookiesIntro,sections:titles.map((title,i)=>[title,sections[i]])};
}
function legal(which){
 const p=localizedLegal(which),t=LEGAL_TRANSLATIONS[lang];
 return `<section class="legal-page"><div class="legal-wrap"><a class="legal-back" href="#/">← ${t?t.back:"Retour à l’accueil"}</a><span class="eyebrow">LE COCON · ${t?t.info:"INFORMATIONS"}</span><h1>${p.title}</h1><p class="legal-intro">${p.intro}</p>${p.sections.map(([title,body])=>`<section class="legal-panel"><h2>${title}</h2>${body}</section>`).join('')}<div class="mini-links"><a href="#/mentions-legales">${t?t.legal:"Mentions légales"}</a><a href="#/politique-confidentialite">${t?t.privacy:"Confidentialité"}</a><a href="#/cookies">${t?t.cookies:"Cookies"}</a></div></div></section>`;
}
