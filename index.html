function home(){const t=LANG[lang];return `${homeHero()}<div class="band"><span>✧ Head Spa</span><span>✧ Massages bien-être</span><span>✧ Pont-l’Évêque · Normandie</span></div>${reviews()}<section class="section"><div class="container"><div class="sectiontop"><span class="eyebrow">LE COCON · HEAD SPA, MODELAGE ET MASSAGE À PONT-L’ÉVÊQUE</span><h2>${t.rituals}</h2><p>${t.intro}</p></div><div class="grid">${SERVICES.slice(0,6).map(card).join('')}</div><div class="actions" style="justify-content:center;margin-top:38px"><a class="btn btn-ghost" href="#/soins">${t.all} ↗</a></div></div></section><section class="split">${img('reflexologie-palmaire','Illustration de réflexologie')}<div class="copy"><span class="eyebrow">LE COCON</span><h2>${t.experience}</h2><p>${t.experienceBody}</p><a class="btn" href="#/experience">${t.ourWorld} ↗</a></div></section>${salonGallery()}${cta()}`}
function list(){const t=LANG[lang];return `<section class="section"><div class="container"><div class="sectiontop"><span class="eyebrow">LE COCON</span><h1>${t.treatments}</h1><p>${t.intro}</p></div><div class="grid">${SERVICES.map(card).join('')}</div></div></section>${cta()}`}
function details(s){const t=LANG[lang],i=SERVICES.findIndex(x=>x.id===s.id);return `${hero(t.serviceNames[i],s.subtitle,s.image,t.kicker,'soins',t.back)}<div class="note">${t.illustration}</div><section class="section"><div class="container"><div class="sectiontop"><span class="eyebrow">${t.details}</span><h2>${s.subtitle}</h2><p>${s.detail}</p></div><div class="info-cards"><div class="info-card"><h3>${t.experience}</h3><p>${s.teaser}</p></div><div class="info-card"><h3>${t.practical}</h3><p>12 rue Ménars, 14130 Pont-l’Évêque</p></div><div class="info-card"><h3>Planity</h3><p>${t.info}</p><a class="btn" href="${PLANITY}" target="_blank" rel="noopener">${t.book} ↗</a></div></div><div class="mini-links"><a href="#/soins">← ${t.back}</a><a href="#/bons-cadeaux">${t.tryGift} ↗</a></div></div></section>`}

const SALON_PHOTOS=[CUSTOM_MEDIA.vitrine,...Array.from({length:11},(_,i)=>'https://raw.githubusercontent.com/cleronwilfried-sketch/le-cocon-bien-etre/main/'+String(i+2).padStart(2,'0')+'.jpg')];
function salonGallery(){
 const t=LANG[lang];
 return `<section class="photo-section" id="galerie-salon"><div class="photo-heading"><h2>${t.gallery}</h2></div>
 <div class="salon-grid">${SALON_PHOTOS.map((url,i)=>`<button type="button" data-photo-url="${url}" aria-label="Agrandir la photo du salon ${i+1}"><img src="${url}" loading="lazy" alt="Photographie du salon Le Cocon n°${i+1}" onerror="this.onerror=null;this.style.display='none';this.nextElementSibling.hidden=false"><span class="photo-fallback" hidden>Illustration de remplacement : photo réelle indisponible</span></button>`).join('')}</div>
 <p class="photo-note">Photo de la vitrine intégrée à la démo ; les autres photos du salon nécessitent une connexion Internet.</p></section>`;
}
function place(){const t=LANG[lang];return `<section class="hero"><div class="copy"><span class="eyebrow">${t.place}</span><h1>${t.experience}</h1><p class="lead">${t.experienceBody}</p><div class="actions"><a class="btn btn-ghost" href="#/galerie">${t.gallery} ↗</a></div></div><div class="hero-img"><img src="${CUSTOM_MEDIA.lieu}" alt="Photo du lieu Le Cocon à Pont-l’Évêque"></div></section><section class="section"><div class="container"><div class="sectiontop"><span class="eyebrow">LE COCON</span><h2>${t.place}</h2><p>${t.experienceBody}</p></div><div class="actions"><a class="btn btn-ghost" href="#/galerie">${t.gallery} ↗</a></div></div></section>${cta()}`}
function galleryPage(){return `${salonGallery()}`}

function gifts(){const t=LANG[lang];return `<section class="hero"><div class="copy"><span class="eyebrow">${t.gifts}</span><h1>${t.giftTitle}</h1><p class="lead">${t.giftBody}</p><div class="actions"><a class="btn" href="${PLANITY}" target="_blank" rel="noopener">${t.book} ↗</a></div></div><div class="hero-img"><img src="${CUSTOM_MEDIA.cadeau}" alt="Carte cadeau du salon Le Cocon"></div></section>${cta()}`}
function contact(){const t=LANG[lang];return `<section class="section contact-access"><div class="container"><div class="sectiontop"><span class="eyebrow">LE COCON · PONT-L’ÉVÊQUE</span><h1>${t.contact}</h1><p>${t.contactBody}</p></div><div class="info-cards"><div class="info-card"><h3>${t.addressLabel}</h3><p>Le Cocon<br>12 rue Ménars<br>14130 Pont-l’Évêque</p></div><div class="info-card"><h3>${t.telephoneLabel}</h3><p><a href="tel:+33259163936">02 59 16 39 36</a></p><h3 style="margin-top:22px">${t.emailLabel}</h3><p><a href="mailto:salon@lecocon14.com">salon@lecocon14.com</a></p><a class="btn" href="mailto:salon@lecocon14.com">${t.emailAction} ↗</a></div><div class="info-card"><h3>${t.mapLabel}</h3><p>12 rue Ménars · 14130 Pont-l’Évêque</p><a class="btn" href="https://www.google.com/maps/search/?api=1&amp;query=12%20rue%20M%C3%A9nars%2C%2014130%20Pont-l%27%C3%89v%C3%AAque" target="_blank" rel="noopener">${t.mapDirections} ↗</a></div></div>${reviews()}<div class="map-wrap"><iframe title="Google Maps — Le Cocon, 12 rue Ménars, Pont-l’Évêque" src="https://www.google.com/maps?q=12%20rue%20M%C3%A9nars%2C%2014130%20Pont-l%27%C3%89v%C3%AAque&amp;output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div></div></section>${cta()}`}
const LEGAL_PAGES={"mentions-legales": {"title": "Mentions légales", "intro": "Informations sur l’éditeur et le fonctionnement du site.", "sections": [["Éditeur du site", "<p><strong>Nom commercial :</strong> Le Cocon Bien-Être</p><p><strong>Exploitante :</strong> Pearl Bartert</p><p><strong>Statut :</strong> Entreprise individuelle</p><p><strong>SIRET :</strong> 941 889 388 00018</p><p><strong>Adresse :</strong> 12 rue Ménars, 14130 Pont-l’Évêque</p><p><strong>Téléphone :</strong> <a href='tel:+33259163936'>02 59 16 39 36</a></p><p><strong>E-mail :</strong> <a href='mailto:salon@lecocon14.com'>salon@lecocon14.com</a></p>"], ["Direction de la publication", "<p>Pearl Bartert.</p>"], ["Hébergement", "<p>La version actuelle du site utilise un dépôt GitHub et peut être publiée sur Cloudflare Pages. L’hébergeur effectif et ses coordonnées doivent être vérifiés avant mise en ligne de cette nouvelle version.</p>"], ["Propriété intellectuelle", "<p>Les contenus, visuels, photographies, textes et éléments graphiques ne peuvent pas être reproduits ou réutilisés sans autorisation préalable, sous réserve des exceptions prévues par la loi.</p>"], ["Contact", "<p>Pour toute question relative au site : <a href='mailto:salon@lecocon14.com'>salon@lecocon14.com</a>.</p>"]]}, "politique-confidentialite": {"title": "Politique de confidentialité", "intro": "Nos informations sur la protection des données personnelles.", "sections": [["Responsable du traitement", "<p>Le Cocon Bien-Être, représenté par son exploitante, 12 rue Ménars, 14130 Pont-l’Évêque.</p><p>Contact : <a href='mailto:salon@lecocon14.com'>salon@lecocon14.com</a>.</p>"], ["Données personnelles", "<p>Ce site vitrine propose des liens vers des services externes, notamment Planity. Les données que vous transmettez à ces services relèvent de leurs politiques de confidentialité. Si vous contactez le salon par e-mail, vos informations servent à répondre à votre demande.</p>"], ["Utilisation et conservation", "<p>Les informations communiquées au salon sont utilisées pour répondre aux demandes et assurer les services concernés, puis conservées pendant la durée nécessaire aux finalités poursuivies et obligations légales applicables.</p>"], ["Vos droits", "<p>Vous pouvez, dans les conditions prévues par le RGPD, demander l’accès, la rectification, l’effacement, la limitation ou la portabilité de vos données, et vous opposer à certains traitements.</p><p>Pour exercer vos droits : <a href='mailto:salon@lecocon14.com'>salon@lecocon14.com</a>. Vous pouvez également saisir la CNIL.</p>"], ["Traceurs et stockage local", "<p>Cette démo utilise le stockage local du navigateur pour retenir votre langue préférée. Les traceurs du site publié doivent être vérifiés avant la mise en ligne de toute nouvelle version.</p>"]]}, "cookies": {"title": "Cookies et autres traceurs", "intro": "Des informations simples sur les technologies utilisées pendant la navigation.", "sections": [["Qu’est-ce qu’un cookie ?", "<p>Un cookie est un petit fichier ou un traceur susceptible d’être enregistré sur votre appareil lors de votre visite sur un site.</p>"], ["Stockage de la langue", "<p>Cette démonstration enregistre votre choix de langue dans le stockage local de votre navigateur afin de le conserver lors de la navigation. Cette préférence ne sert pas au ciblage publicitaire.</p>"], ["Services externes", "<p>Le site contient des liens vers Planity et d’autres services. Ces sites appliquent leurs propres politiques de confidentialité lorsque vous les consultez.</p>"], ["Gérer vos choix", "<p>Vous pouvez supprimer les données de navigation enregistrées dans votre navigateur. Si des traceurs nécessitant un consentement sont ajoutés au site publié, leur activation devra respecter les choix des visiteurs.</p>"], ["Contact", "<p>Pour toute question : <a href='mailto:salon@lecocon14.com'>salon@lecocon14.com</a>.</p>"]]}};
function legal(which){
 const p=LEGAL_PAGES[which]||LEGAL_PAGES['mentions-legales'];
 return `<section class="legal-page"><div class="legal-wrap"><a class="legal-back" href="#/">← Retour à l’accueil</a><span class="eyebrow">LE COCON · INFORMATIONS</span><h1>${p.title}</h1><p class="legal-intro">${p.intro}</p>${p.sections.map(([title,body])=>`<section class="legal-panel"><h2>${title}</h2>${body}</section>`).join('')}<div class="mini-links"><a href="#/mentions-legales">Mentions légales</a><a href="#/politique-confidentialite">Confidentialité</a><a href="#/cookies">Cookies</a></div></div></section>`;
}
function render(){nav();const route=decodeURIComponent(location.hash.replace(/^#\/?/,'')),id=route.replace(/^\//,'');let html= id===''?home():id==='soins'?list():id==='experience'?place():id==='galerie'?galleryPage():id==='bons-cadeaux'?gifts():id==='contact'?contact():['mentions-legales','politique-confidentialite','cookies'].includes(id)?legal(id):SERVICES.find(s=>s.id===id)?details(SERVICES.find(s=>s.id===id)):home();document.getElementById('app').innerHTML=html;document.getElementById('links').classList.remove('open');document.getElementById('hamb').setAttribute('aria-expanded','false');document.querySelectorAll('#links a[href^="#/"]').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===location.hash));window.scrollTo(0,0);}
document.getElementById('brand-logo').src=HEADER_ORIGINAL_LOTUS;document.getElementById('language').value=lang;document.getElementById('language').addEventListener('change',e=>{lang=e.target.value;try{localStorage.setItem('lecocon-lang',lang)}catch(e){}render()});document.getElementById('hamb').addEventListener('click',()=>{let links=document.getElementById('links'),on=links.classList.toggle('open');document.getElementById('hamb').setAttribute('aria-expanded',String(on))});window.addEventListener('hashchange',render);document.addEventListener('click',e=>{let b=e.target.closest('[data-photo],[data-photo-url]');if(b){document.getElementById('big-image').src=b.dataset.photoUrl||ASSETS[b.dataset.photo];let m=document.getElementById('lightbox');m.classList.add('open');document.getElementById('big-image').style.display='block';m.setAttribute('aria-hidden','false');}});function closeBox(){let m=document.getElementById('lightbox');m.classList.remove('open');document.getElementById('big-image').style.display='none';m.setAttribute('aria-hidden','true')}document.getElementById('close-lightbox').addEventListener('click',closeBox);document.getElementById('lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeBox()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBox()});render();
</script></body></html>
